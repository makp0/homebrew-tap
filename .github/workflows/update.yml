name: Update switchpack
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    paths: ['scripts/**', '.github/workflows/update.yml']

permissions:
  contents: write

concurrency:
  group: update-switchpack
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s scripts
      - name: Fetch current release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update.py
      - name: Validate formula
        run: ruby -c Formula/switchpack.rb
      - name: Install and test formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew tap makp0/tap
          mkdir -p "$(brew --repository makp0/tap)/Formula"
          cp Formula/switchpack.rb "$(brew --repository makp0/tap)/Formula/switchpack.rb"
          brew install makp0/tap/switchpack
          brew test makp0/tap/switchpack
      - name: Commit formula update
        run: |
          if git diff --quiet -- Formula/switchpack.rb && git ls-files --error-unmatch Formula/switchpack.rb >/dev/null 2>&1; then
            echo 'Formula is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/switchpack.rb
          git commit -m 'chore: update switchpack formula from latest release'
          git push
